name: Публикация

# Выгрузка данных OpenAlex → сборка → проверки → публикация на GitHub Pages.
#
# Нужно один раз:
#   Settings → Pages → Source: «GitHub Actions».
# Без ключа используется разрешённый анонимный доступ OpenAlex. Опциональный секрет
# OPENALEX_API_KEY увеличивает доступный бюджет. Неполная выгрузка не публикуется.
#
# Снимок данных кэшируется на месяц: повторные запуски в том же месяце не тратят запросы OpenAlex.
# Ежемесячный запуск по расписанию берёт свежие данные; принудительно — Run workflow → refresh.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 3 * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Заново выгрузить данные OpenAlex, даже если снимок этого месяца уже есть
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты
        run: npm test

      - name: Режим доступа OpenAlex
        id: key
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "::notice title=OpenAlex без ключа::Используется анонимный бюджет API. Если он исчерпан, выгрузка завершится ошибкой и публикация не будет выполнена."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Режим GitHub Pages
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          type=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null) || type=none
          if [ "$type" != workflow ]; then
            echo "::notice title=Pages не настроены::В Settings → Pages → Source выберите «GitHub Actions», чтобы сайт публиковался (сейчас: $type)."
          fi
          if [ "$type" = workflow ]; then deploy=true; else deploy=false; fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Месяц снимка
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Снимок данных этого месяца
        id: cache
        uses: actions/cache@v4
        with:
          path: data/snapshot/snapshot.json
          key: openalex-${{ steps.month.outputs.value }}-${{ hashFiles('config/site.mjs', 'content/competencies.mjs', 'tools/fetch-openalex.mjs', 'src/lib/openalex.mjs') }}

      - name: Выгрузка OpenAlex
        if: steps.cache.outputs.cache-hit != 'true' || inputs.refresh
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node tools/fetch-openalex.mjs --no-key

      - name: Настройка Pages
        id: pages
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Сборка сайта
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/stankin-science/' }}
        run: node tools/build.mjs

      - name: Проверка сборки
        run: node tools/check.mjs --dir dist --publish

      - name: Снимок данных — в артефакты запуска
        uses: actions/upload-artifact@v4
        with:
          name: openalex-snapshot-${{ steps.month.outputs.value }}
          path: data/snapshot/snapshot.json
          retention-days: 90

      - name: Сборка — в артефакт Pages
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
